<style>
/* ============================================================
   สมาคมสภาคนพิการทุกประเภทแห่งประเทศไทย — Disabilities Thailand (DTH)
   External stylesheet (extracted from inline <style> + redesign pass)
   Accessibility hooks (a11y-bar, a11y-btn, hc-white, hc-yellow) preserved.
   ============================================================ */

:root{
  --brand:#90C73E;--brand-dark:#5C8F11;--brand-deep:#3f6510;--brand-tint:#f1f8e6;
  --ink:#1d241b;--muted:#516049;--bg:#ffffff;--bg-soft:#f5f8f0;--card:#ffffff;--border:#edf2e8;

  /* Spacing scale — 4pt base */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;--s9:96px;
  --section:clamp(64px,7.5vw,112px);
  --gap-card:clamp(20px,2.4vw,30px);

  /* Soft, smooth elevation scale (single hue, layered) */
  --shadow-sm:0 1px 3px rgba(40,70,15,.05);
  --shadow:0 8px 24px -10px rgba(40,70,15,.16);
  --shadow-lg:0 22px 50px -18px rgba(40,70,15,.24);

  --radius:18px;--radius-sm:12px;--fs:1;--maxw:1180px;--ease:cubic-bezier(.22,.61,.36,1);
}
body.hc-white{--brand:#9fe04a;--brand-dark:#9fe04a;--brand-deep:#9fe04a;--brand-tint:#111;
  --ink:#fff;--muted:#e8e8e8;--bg:#000;--bg-soft:#000;--card:#0a0a0a;--border:#666;
  --shadow-sm:none;--shadow:none;--shadow-lg:none}
body.hc-yellow{--brand:#ffff00;--brand-dark:#ffff00;--brand-deep:#ffff00;--brand-tint:#111;
  --ink:#ffff00;--muted:#ffff00;--bg:#000;--bg-soft:#000;--card:#0a0a0a;--border:#ffd000;
  --shadow-sm:none;--shadow:none;--shadow-lg:none}

*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(16px * var(--fs));scroll-behavior:smooth}
[id]{scroll-margin-top:96px}
body{font-family:'Kanit','Noto Sans Thai',system-ui,sans-serif;color:var(--ink);background:var(--bg);
  line-height:1.65;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
h1,h2,h3{text-wrap:balance}
p{text-wrap:pretty}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(20px,4vw,32px)}
:focus-visible{outline:3px solid var(--brand-dark);outline-offset:2px;border-radius:6px}

.skip{position:absolute;left:-999px;top:0;z-index:999;background:var(--brand-dark);color:#fff;padding:12px 20px;border-radius:0 0 10px 0;font-weight:600}
.skip:focus{left:0}

/* ---- Accessibility bar (DO NOT alter behaviour) ---- */
.a11y-bar{background:var(--bg-soft);border-bottom:1px solid var(--border);font-size:.82rem}
.a11y-bar .wrap{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:flex-end;padding:8px clamp(20px,4vw,32px)}
.a11y-group{display:flex;align-items:center;gap:6px}
.a11y-group>span{color:var(--muted);font-weight:500}
.a11y-btn{border:1px solid var(--border);background:var(--card);color:var(--ink);width:34px;height:30px;
  border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600;display:inline-flex;align-items:center;justify-content:center;transition:.18s}
.a11y-btn:hover{border-color:var(--brand-dark);color:var(--brand-dark)}
.a11y-btn.active{background:var(--brand);border-color:var(--brand);color:#16320a}
.sw-white{background:#000;color:#fff}.sw-yellow{background:#000;color:#ff0}

/* ---- Header ---- */
header.site{position:sticky;top:0;z-index:200;background:var(--bg);border-bottom:1px solid var(--border);transition:box-shadow .25s}
header.site.scrolled{box-shadow:var(--shadow)}
.nav{display:flex;align-items:center;gap:18px;padding:14px clamp(20px,4vw,32px);max-width:var(--maxw);margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;font-weight:600;line-height:1.15}
.brand .logo{width:54px;height:54px;border-radius:12px;background:var(--brand-tint);display:grid;place-items:center;overflow:hidden;flex-shrink:0;border:1px solid var(--border)}
.brand .logo img{width:100%;height:100%;object-fit:contain}
.brand .name b{color:var(--brand-dark);display:block;font-size:1.04rem;letter-spacing:-.01em}
.brand .name span{color:var(--muted);font-size:.78rem;font-weight:400}
nav.menu{margin-left:auto;display:flex;gap:2px;align-items:center}
nav.menu>a,.has-sub>a{padding:10px 13px;border-radius:10px;font-weight:500;font-size:.95rem;color:var(--ink);
  transition:.18s;position:relative;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
nav.menu>a:hover,.has-sub>a:hover{background:var(--brand-tint);color:var(--brand-dark)}
nav.menu a.active{color:var(--brand-dark)}
nav.menu a.active::after{content:"";position:absolute;left:13px;right:13px;bottom:4px;height:3px;border-radius:3px;background:var(--brand)}
.has-sub{position:relative}
.has-sub .caret{font-size:.62rem;transition:transform .2s;opacity:.7}
.has-sub .sub{position:absolute;top:calc(100% + 4px);left:0;min-width:200px;background:var(--card);
  border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:8px;display:flex;
  flex-direction:column;gap:2px;opacity:0;visibility:hidden;transform:translateY(8px);transition:.2s;z-index:300}
.has-sub:hover .sub,.has-sub:focus-within .sub{opacity:1;visibility:visible;transform:translateY(0)}
.has-sub:hover .caret,.has-sub:focus-within .caret{transform:rotate(180deg)}
.has-sub .sub a{padding:9px 14px;border-radius:9px;font-size:.9rem;font-weight:400;white-space:nowrap;transition:.15s}
.has-sub .sub a:hover{background:var(--brand-tint);color:var(--brand-dark)}
.search-mini{display:flex;align-items:center;background:var(--bg-soft);border:1px solid var(--border);border-radius:999px;padding:6px 6px 6px 14px;gap:6px}
.search-mini input{border:0;background:transparent;outline:none;font-family:inherit;width:110px;color:var(--ink)}
.search-mini button{border:0;background:var(--brand);color:#16320a;width:32px;height:32px;border-radius:50%;cursor:pointer;font-weight:700;display:grid;place-items:center}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--border);border-radius:10px;width:44px;height:44px;cursor:pointer;flex-direction:column;gap:5px;align-items:center;justify-content:center}
.burger span{width:22px;height:2px;background:var(--ink);border-radius:2px}

/* ---- Hero ---- */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--brand-tint),#fff)}
.slides{position:relative;height:clamp(300px,44vw,540px)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .8s var(--ease);background-size:cover;background-position:center;display:flex;align-items:flex-end}
.slide.on{opacity:1}
.slide::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,40,5,.8),rgba(20,40,5,.1) 58%,transparent)}
.slide .cap{position:relative;z-index:2;color:#fff;padding:clamp(28px,5vw,52px);max-width:var(--maxw);margin:0 auto;width:100%}
.slide .cap .tag{display:inline-block;background:var(--brand);color:#16320a;font-weight:600;padding:5px 14px;border-radius:999px;font-size:.8rem;margin-bottom:16px;letter-spacing:.01em}
.slide .cap h2{font-size:clamp(1.5rem,3.6vw,2.7rem);font-weight:700;text-shadow:0 2px 14px rgba(0,0,0,.45);line-height:1.2;letter-spacing:-.02em;max-width:18ch}
.slide .cap p{margin-top:12px;opacity:.95;font-weight:300;font-size:clamp(.95rem,1.4vw,1.1rem);max-width:52ch}
.hero-dots{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:10px}
.hero-dots button{width:12px;height:12px;border-radius:50%;border:2px solid #fff;background:transparent;cursor:pointer;transition:.2s}
.hero-dots button.on{background:#fff;width:30px;border-radius:7px}
.hero-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:5;background:rgba(255,255,255,.85);border:0;width:46px;height:46px;border-radius:50%;cursor:pointer;font-size:1.3rem;color:var(--brand-deep);display:grid;place-items:center;transition:.2s}
.hero-arrow:hover{background:#fff}.hero-arrow.prev{left:18px}.hero-arrow.next{right:18px}

/* ---- Section rhythm ---- */
section.block{padding:var(--section) 0}
section.alt{background:var(--bg-soft)}
.head{display:flex;align-items:center;gap:var(--s3);margin-bottom:clamp(28px,4vw,46px);flex-wrap:wrap}
.head .ic{width:44px;height:44px;border-radius:13px;background:var(--brand-tint);color:var(--brand-deep);
  display:grid;place-items:center;font-size:1.25rem;flex-shrink:0;border:1px solid var(--border)}
.head h2{font-size:clamp(1.5rem,2.9vw,2.1rem);font-weight:700;color:var(--ink);letter-spacing:-.02em;line-height:1.2}
.head h2 span{color:var(--muted);font-weight:400;font-size:.56em;letter-spacing:0}
.head .more{margin-left:auto;font-weight:600;color:var(--brand-dark);font-size:.92rem;border:1px solid var(--border);padding:10px 20px;border-radius:999px;transition:.2s}
.head .more:hover{background:var(--brand);color:#16320a;border-color:var(--brand)}

/* ---- About ---- */
.about{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(32px,5vw,56px);align-items:center}
.about .txt h2{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700;color:var(--brand-dark);line-height:1.25;margin-bottom:var(--s4);letter-spacing:-.015em}
.about .txt p{color:var(--muted);margin-bottom:var(--s4);max-width:62ch}
.about .pic{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-lg);aspect-ratio:4/3;background:var(--brand-tint)}
.about .pic img{width:100%;height:100%;object-fit:cover}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#16320a;font-weight:600;padding:12px 26px;border-radius:999px;transition:.2s var(--ease);border:2px solid var(--brand);cursor:pointer;font-family:inherit;font-size:.95rem}
.btn:hover{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff;transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--brand-dark);border-color:var(--border)}
.btn.ghost:hover{border-color:var(--brand-dark);background:var(--brand-tint);color:var(--brand-dark);transform:none}
.btn.sm{padding:9px 18px;font-size:.85rem}

/* ---- Card grids ---- */
.grid{display:grid;gap:var(--gap-card)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow-sm);transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--brand)}
.card .thumb{aspect-ratio:16/10;background:var(--brand-tint);overflow:hidden;position:relative}
.card .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.card:hover .thumb img{transform:scale(1.05)}
.thumb.ph{display:grid;place-items:center;font-size:2.8rem;color:var(--brand)}
.play{position:absolute;inset:0;display:grid;place-items:center}
.play span{width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:1.1rem;padding-left:3px}
.mtype{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.62);color:#fff;font-size:.7rem;font-weight:600;padding:3px 11px;border-radius:999px}
.card .body{padding:var(--s5) var(--s5) calc(var(--s5) + 2px);display:flex;flex-direction:column;gap:var(--s3);flex:1}
.meta{display:flex;flex-wrap:wrap;gap:var(--s3);font-size:.78rem;color:var(--muted)}
.chip{display:inline-block;background:var(--brand-tint);color:var(--brand-deep);font-size:.7rem;font-weight:600;letter-spacing:.02em;padding:4px 12px;border-radius:999px;width:fit-content}
.card h3{font-size:1.12rem;font-weight:600;line-height:1.42;letter-spacing:-.01em;color:var(--ink)}
.card p{font-size:.9rem;color:var(--muted);line-height:1.6}

/* ---- Tabs / filter ---- */
.tabs,.filterbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--s5)}
.tab{padding:9px 18px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:inherit;font-weight:500;font-size:.9rem;cursor:pointer;transition:.18s}
.tab:hover{border-color:var(--brand);color:var(--brand-dark)}
.tab.active{background:var(--brand);border-color:var(--brand);color:#16320a}
.tabpanel{display:none}
.tabpanel.active{display:block;animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- Activities ---- */
.events{display:flex;flex-direction:column;gap:var(--s4)}
.evt{display:flex;gap:clamp(16px,2.5vw,24px);background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:clamp(18px,2.5vw,24px);box-shadow:var(--shadow-sm);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.evt:hover{box-shadow:var(--shadow);transform:translateY(-3px)}
.evt-date{flex-shrink:0;width:92px;background:var(--brand-tint);border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--brand-deep);padding:var(--s3)}
.evt-date .d{font-size:2.1rem;font-weight:700;line-height:1;letter-spacing:-.02em}
.evt-date .m{font-size:.8rem;margin-top:var(--s1);font-weight:500}
.evt-body{flex:1;min-width:0}
.evt-body h3{font-size:1.25rem;font-weight:700;margin:var(--s2) 0;line-height:1.3;letter-spacing:-.015em}
.evt-body .meta{margin-bottom:var(--s1)}
.evt-actions{display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s4)}
.status{display:inline-block;font-size:.74rem;font-weight:600;padding:4px 12px;border-radius:999px}
.status.open{background:#e6f6e0;color:#2f7d12}
.status.soon{background:#fff3d6;color:#9a6b00}
.status.closed{background:#eee;color:#777}

/* ---- Rights quick access (filled tiles, fewer outlines) ---- */
.rights{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:var(--s4)}
.right-card{background:var(--brand-tint);border:1px solid var(--border);border-radius:var(--radius);padding:var(--s6) var(--s4);
  text-align:center;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .25s;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:var(--s3)}
.right-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);background:var(--card)}
.right-card .ric{width:60px;height:60px;border-radius:16px;background:var(--card);display:grid;place-items:center;font-size:1.8rem;box-shadow:var(--shadow-sm)}
.right-card h3{font-size:1rem;font-weight:600}
.right-card p{font-size:.82rem;color:var(--muted)}

/* ---- Downloads ---- */
.dl-list{display:flex;flex-direction:column;gap:var(--s3)}
.dl{display:flex;align-items:center;gap:var(--s4);background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:var(--s4) var(--s5);transition:.25s var(--ease)}
.dl:hover{border-color:var(--brand);box-shadow:var(--shadow-sm);transform:translateX(4px)}
.dl .ft{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:.8rem;flex-shrink:0}
.ft.pdf{background:#d6453c}.ft.doc{background:#2a73d6}
.dl .info{flex:1;min-width:0}
.dl .info p{font-weight:500;font-size:.94rem}
.dl .info .meta{margin-top:4px}
.dl .arr{color:var(--brand-dark);font-size:1.3rem}

/* ---- Partners ---- */
.partners{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:var(--s3)}
.partner{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:var(--s5) var(--s3);text-align:center;transition:.25s var(--ease);display:flex;flex-direction:column;align-items:center;gap:var(--s3)}
.partner:hover{border-color:var(--brand);box-shadow:var(--shadow);transform:translateY(-4px)}
.partner img{width:64px;height:64px;object-fit:contain;border-radius:12px;background:var(--brand-tint);padding:var(--s2)}
.partner span{font-size:.76rem;color:var(--muted);line-height:1.4}

/* ---- Hotline ---- */
.hotline{background:linear-gradient(120deg,var(--brand-dark),var(--brand-deep));color:#fff;border-radius:24px;padding:clamp(32px,5vw,48px);display:flex;flex-wrap:wrap;align-items:center;gap:var(--s5);justify-content:space-between}
body.hc-white .hotline,body.hc-yellow .hotline{border:2px solid var(--brand)}
.hotline .l h3{font-size:clamp(1.4rem,2.4vw,1.7rem);font-weight:600}
.hotline .l p{opacity:.9}
.hotline a.call{background:#fff;color:var(--brand-deep);font-weight:700;font-size:1.6rem;padding:16px 38px;border-radius:999px;display:inline-flex;align-items:center;gap:12px;transition:.2s var(--ease)}
.hotline a.call:hover{transform:scale(1.04)}

/* ---- Contact ---- */
.contact{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(24px,4vw,40px);align-items:stretch}
.contact .info{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:clamp(24px,3vw,34px)}
.contact .info h2{font-size:1.35rem;color:var(--brand-dark);margin-bottom:var(--s4);font-weight:700;letter-spacing:-.01em}
.contact .info p{color:var(--muted);margin-bottom:var(--s3);font-size:.96rem;max-width:48ch}
.contact .info a.tel{display:inline-flex;gap:10px;align-items:center;color:var(--brand-dark);font-weight:700;font-size:1.3rem;margin-top:var(--s2)}
.contact .map{border-radius:var(--radius);overflow:hidden;min-height:320px;border:1px solid var(--border)}
.contact .map iframe{width:100%;height:100%;border:0;display:block}

/* ---- Social ---- */
.social{text-align:center}
.social h2{font-size:clamp(1.3rem,2.2vw,1.6rem);color:var(--brand-dark);margin-bottom:var(--s6);font-weight:700;letter-spacing:-.01em}
.social .links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.social .links a{width:54px;height:54px;border-radius:50%;background:var(--brand-tint);color:var(--brand-dark);display:grid;place-items:center;font-weight:700;font-size:.8rem;transition:.2s var(--ease);border:1px solid var(--border)}
.social .links a:hover{background:var(--brand);color:#16320a;transform:translateY(-4px) scale(1.06)}
.social .links a svg{width:25px;height:25px}

/* ---- Footer ---- */
footer.site{background:var(--bg-soft);border-top:1px solid var(--border);padding:clamp(40px,5vw,56px) 0 var(--s5);margin-top:var(--s5)}
.foot{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:clamp(24px,3vw,36px)}
.foot .col h4{font-size:1rem;color:var(--brand-dark);margin-bottom:var(--s4);font-weight:700}
.foot .col a{display:block;color:var(--muted);font-size:.88rem;padding:5px 0;transition:.15s}
.foot .col a:hover{color:var(--brand-dark)}
.copy{text-align:center;color:var(--muted);font-size:.82rem;border-top:1px solid var(--border);margin-top:var(--s7);padding-top:var(--s5)}

@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.about,.contact,.foot,#dl-wrap{grid-template-columns:1fr!important}.foot{gap:22px}}
@media(max-width:760px){
  nav.menu,.search-mini{display:none}
  .burger{display:flex}
  nav.menu.open{display:flex;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--bg);padding:14px;gap:6px;box-shadow:var(--shadow-lg);border-bottom:1px solid var(--border)}
  nav.menu.open a{width:100%}
  .has-sub{width:100%}
  .has-sub>a{width:100%;justify-content:space-between}
  .has-sub .sub{position:static;opacity:1;visibility:visible;transform:none;box-shadow:none;border:0;border-radius:0;padding:2px 0 6px 16px;min-width:0;display:none}
  .has-sub.open .sub{display:flex}
  .has-sub.open .caret{transform:rotate(180deg)}
  .g3{grid-template-columns:1fr}
  .hotline{padding:28px;flex-direction:column;text-align:center}
  .slide .cap{padding:24px}
  .evt{flex-direction:column}
  .evt-date{width:100%;flex-direction:row;gap:10px;justify-content:flex-start;padding:12px 16px}
}
@media(max-width:480px){.g4{grid-template-columns:1fr}}

/* ---- Floating contact ---- */
.fab-wrap{position:fixed;right:18px;bottom:20px;z-index:500;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.fab-panel{display:flex;flex-direction:column;gap:10px;align-items:stretch;opacity:0;visibility:hidden;transform:translateY(12px) scale(.96);transform-origin:bottom right;transition:.25s var(--ease);pointer-events:none}
.fab-wrap.open .fab-panel{opacity:1;visibility:visible;transform:none;pointer-events:auto}
.fab-item{display:inline-flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);color:var(--ink);padding:9px 16px 9px 9px;border-radius:999px;box-shadow:var(--shadow);font-weight:500;font-size:.9rem;font-family:inherit;cursor:pointer;transition:.18s var(--ease);text-decoration:none}
